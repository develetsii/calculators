
<main class="main">
  <div class="content">
    <div class="tabs">
      <button [class.active]="activeTab === 1"  
      (click)="changeTab(1)">Normal</button>

      <button [class.active]="activeTab === 2"
      (click)="changeTab(2)">Cientific</button>
    </div>

    @if(activeTab === 1) {
      <app-calculator></app-calculator>
    }

    @if(activeTab === 2) {
      <app-cientific-calculator></app-cientific-calculator>
    }
    
  </div>
</main>

<router-outlet />
